services:
  backend-debug:
    build: 
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - HOST=0.0.0.0
      - PORT=3000
      - RUST_LOG=debug  # More verbose logging
      - API_KEY=test-api-key
    volumes:
      # Mount source code for development (if you want to rebuild on changes)
      - ./src:/app/src:ro
      - ./wordlist:/app/wordlist:ro
      # Mount cargo cache for faster rebuilds
      - cargo-cache:/usr/local/cargo/registry
    networks:
      - apronymer-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    # Keep container running even if app crashes for debugging
    restart: unless-stopped

  frontend:
    image: apronymer-frontend:latest
    ports:
      - "80:80"
    depends_on:
      - backend-debug
    networks:
      - apronymer-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  apronymer-network:
    driver: bridge

volumes:
  cargo-cache:

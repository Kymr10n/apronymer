name: Deploy to Azure Container Apps

on:
  workflow_dispatch:
    inputs:
      clean:
        description: 'Delete apps before redeploying'
        required: false
        default: 'false'
      target:
        description: 'What to deploy'
        required: false
        default: 'both'
        type: choice
        options:
          - both
          - backend
          - frontend

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true

      - name: Lint backend (cargo clippy)
        run: |
          cd backend
          cargo clippy --all -- -D warnings

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Lint frontend (eslint)
        run: |
          cd frontend
          npm run lint

  test:
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true

      - name: Run backend unit tests
        run: |
          cd backend
          cargo test --all --locked --color always

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Run frontend unit tests
        run: |
          cd frontend
          npm test -- --ci --passWithNoTests

  deploy:
    runs-on: ubuntu-latest
    environment: production (azure-container-apps)  # adjust if needed
    needs: [test]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Log in to Azure
      uses: azure/login@v1
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }} # Make sure this secret is set in your GitHub repository settings under Settings > Secrets and variables > Actions

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Set up deployment flags
      id: setup
      run: |
        echo "FLAGS=" >> $GITHUB_ENV
        case "${{ github.event.inputs.target }}" in
          backend) echo "FLAGS=--backend" >> $GITHUB_ENV ;;
          frontend) echo "FLAGS=--frontend" >> $GITHUB_ENV ;;
          both|*) echo "FLAGS=--both" >> $GITHUB_ENV ;;
        esac

        if [[ "${{ github.event.inputs.clean }}" == "true" ]]; then
          echo "FLAGS=--clean $FLAGS" >> $GITHUB_ENV
        fi

    - name: Run deployment script
      env:
        API_KEY: ${{ secrets.API_KEY }}
      run: |
        chmod +x ./backend/deploy-to-aca.sh
        ./backend/deploy-to-aca.sh $FLAGS

    - name: Get backend FQDN from Azure
      id: get-fqdn
      run: |
        set -e
        FQDN=$(az containerapp show \
          --name apronymer-backend \
          --resource-group rg-apronymer \
          --query properties.configuration.ingress.fqdn \
          -o tsv)
        echo "fqdn=$FQDN" >> $GITHUB_OUTPUT

    - name: Wait for backend to become available
      run: sleep 30

    - name: Health check (backend)
      run: |
        set -e
        BACKEND_URL="https://${{ steps.get-fqdn.outputs.fqdn }}/health"
        echo "Checking $BACKEND_URL"
        response=$(curl -sf "$BACKEND_URL")
        echo "$response"
        status=$(echo "$response" | jq -r .status)
        if [ "$status" != "healthy" ]; then
          echo "❌ Health check failed: status=$status"
          exit 1
        fi
        echo "✅ Health check passed: status=$status"
